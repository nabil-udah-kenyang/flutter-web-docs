<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Dokumentasi belajar Dart dan Flutter dari beginner sampai GetX, Get CLI, state management, API, dan studi kasus."
    />
    <meta name="author" content="Naufal Nabil" />
    <title>Docs - Dart & Flutter Beginner Track</title>
    <link rel="icon" type="image/png" href="./assets/images/logo.png" />
    <link rel="apple-touch-icon" href="./assets/images/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css"
    />
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body class="bg-[#070b14] text-slate-100">
    <div class="min-h-screen">
      <aside
        id="sidebar"
        class="fixed inset-y-0 left-0 z-50 w-[20rem] -translate-x-full border-r border-white/10 bg-[#0b1020] transition-transform duration-200 lg:translate-x-0"
      >
        <div class="flex h-full flex-col">
          <div
            class="flex h-16 items-center justify-between border-b border-white/10 px-4"
          >
            <a href="./index.html" class="flex min-w-0 items-center gap-3">
              <img
                class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-cyan-400 text-base font-semibold text-slate-950 shadow-lg shadow-cyan-400/20"
                src="assets/images/logo.png"
              />
              <span class="min-w-0">
                <span class="block truncate text-sm font-bold text-white"
                  >Flutter Track</span
                >
                <span
                  class="block truncate text-xs font-semibold text-slate-400"
                  >Beginner Docs</span
                >
              </span>
            </a>
            <button
              id="closeSidebar"
              class="rounded-lg border border-white/10 px-2 py-1 text-slate-400 lg:hidden"
              aria-label="Tutup sidebar"
            >
              ✕
            </button>
          </div>

          <div class="border-b border-white/10 p-4">
            <label
              class="flex items-center gap-2 rounded-xl border border-white/10 bg-white/[0.04] px-3 py-2.5"
            >
              <svg
                width="17"
                height="17"
                viewBox="0 0 24 24"
                fill="none"
                class="text-slate-500"
                aria-hidden="true"
              >
                <path
                  d="m21 21-4.35-4.35M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                />
              </svg>
              <input
                id="search"
                type="search"
                class="w-full bg-transparent text-sm font-semibold text-slate-200 outline-none placeholder:text-slate-500"
                placeholder="Cari modul, GetX, API..."
              />
            </label>
          </div>

          <div class="grid grid-cols-2 gap-3 border-b border-white/10 p-4">
            <div
              class="rounded-xl border border-cyan-400/20 bg-cyan-400/10 p-3"
            >
              <p id="moduleCount" class="text-2xl font-semibold text-cyan-300">
                47
              </p>
              <p class="text-xs font-bold text-cyan-100/70">Modul</p>
            </div>
            <div
              class="rounded-xl border border-emerald-400/20 bg-emerald-400/10 p-3"
            >
              <p
                id="trackCount"
                class="text-2xl font-semibold text-emerald-300"
              >
                15
              </p>
              <p class="text-xs font-bold text-emerald-100/70">Track</p>
            </div>
          </div>

          <nav
            id="moduleList"
            class="docs-scrollbar flex-1 overflow-y-auto p-4"
          ></nav>
        </div>
      </aside>

      <div
        id="overlay"
        class="fixed inset-0 z-40 hidden bg-black/60 backdrop-blur-sm lg:hidden"
      ></div>

      <div class="lg:pl-[20rem] xl:pr-80">
        <header
          class="sticky top-0 z-30 border-b border-white/10 bg-[#070b14]/88 backdrop-blur-xl"
        >
          <div class="flex h-16 items-center gap-3 px-4 sm:px-6 lg:px-8">
            <button
              id="menuButton"
              class="inline-flex h-10 w-10 items-center justify-center rounded-xl border border-white/10 bg-white/[0.04] text-slate-300 lg:hidden"
              aria-label="Buka sidebar"
            >
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                aria-hidden="true"
              >
                <path
                  d="M4 7h16M4 12h16M4 17h16"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                />
              </svg>
            </button>

            <div
              id="breadcrumb"
              class="flex min-w-0 flex-1 flex-wrap items-center gap-2 text-sm text-slate-400"
            ></div>

            <a
              href="./index.html"
              class="hidden rounded-xl border border-white/10 bg-white/[0.04] px-3 py-2 text-sm font-bold text-slate-300 transition hover:border-cyan-400/40 hover:text-cyan-200 sm:inline-flex"
              >Intro</a
            >
            <a
              href="https://github.com/nabil-udah-kenyang/flutter_beginner_lesson"
              target="_blank"
              rel="noreferrer"
              class="hidden items-center gap-2 rounded-xl border border-white/10 bg-white/[0.04] px-3 py-2 text-sm font-bold text-slate-300 transition hover:border-cyan-400/40 hover:text-cyan-200 sm:inline-flex"
            >
              <svg
                width="17"
                height="17"
                viewBox="0 0 24 24"
                fill="currentColor"
                aria-hidden="true"
              >
                <path
                  fill-rule="evenodd"
                  clip-rule="evenodd"
                  d="M12 .5C5.65.5.5 5.65.5 12c0 5.09 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56v-2.16c-3.2.7-3.88-1.36-3.88-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.02 1.76 2.68 1.25 3.34.96.1-.74.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.68 0-1.25.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.04 0 0 .97-.31 3.17 1.18A11.1 11.1 0 0 1 12 6.04c.98 0 1.95.13 2.86.39 2.2-1.49 3.17-1.18 3.17-1.18.63 1.58.23 2.75.11 3.04.74.81 1.18 1.84 1.18 3.09 0 4.41-2.69 5.38-5.25 5.67.41.36.78 1.06.78 2.14v3.16c0 .31.21.68.79.56A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"
                />
              </svg>
              <span>GitHub</span>
            </a>
          </div>
        </header>

        <main class="min-h-screen">
          <div class="mx-auto max-w-6xl px-4 py-6 sm:px-6 lg:px-8">
            <div class="mb-5 flex flex-wrap items-center justify-end gap-2">
              <button
                id="prevModule"
                class="rounded-xl border border-white/10 bg-white/[0.04] px-3 py-2 text-sm font-bold text-slate-300 transition hover:border-cyan-400/40 hover:text-cyan-200 disabled:cursor-not-allowed disabled:opacity-40"
              ></button>
              <button
                id="nextModule"
                class="rounded-xl border border-white/10 bg-white/[0.04] px-3 py-2 text-sm font-bold text-slate-300 transition hover:border-cyan-400/40 hover:text-cyan-200 disabled:cursor-not-allowed disabled:opacity-40"
              ></button>
            </div>

            <div id="lesson" class="pb-20"></div>
          </div>
        </main>
      </div>

      <aside
        class="fixed right-0 top-0 hidden h-screen w-80 border-l border-white/10 bg-[#0b1020]/80 p-6 pt-20 backdrop-blur-xl xl:block"
      >
        <p class="text-xs font-bold uppercase tracking-[0.18em] text-slate-500">
          On This Page
        </p>
        <nav id="toc" class="mt-4 grid gap-1"></nav>
        <div
          class="mt-8 rounded-2xl border border-cyan-400/15 bg-cyan-400/10 p-4"
        >
          <p class="text-sm font-bold text-cyan-100">Tip Belajar</p>
          <p class="mt-2 text-sm leading-6 text-slate-300">
            Baca konsep, buka tab source file, lalu ketik ulang bagian yang
            berubah. Dari situ polanya cepat kebaca.
          </p>
        </div>
        <div
          class="mt-4 rounded-2xl border border-white/10 bg-white/[0.035] p-4"
        >
          <p
            class="text-xs font-bold uppercase tracking-[0.16em] text-slate-500"
          >
            Credit
          </p>
          <a href="https://github.com/nabil-udah-kenyang"><p class="mt-2 text-sm font-semibold text-slate-300">
            Created by Naufal Nabil
          </p></a>
          
          <p class="mt-1 text-xs font-semibold text-slate-500">
            © 2026 Naufal Nabil
          </p>
        </div>
      </aside>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-dart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-yaml.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-json.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js"></script>
    <script src="./assets/code-data.js"></script>
    <script src="./assets/app.js"></script>
